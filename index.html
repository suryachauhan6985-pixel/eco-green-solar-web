<script>
/* Apply saved theme, font and avatar BEFORE CSS paints to avoid flash */
(function(){
  try {
    var allowedThemes = ['dark', 'gray', 'light', 'emerald', 'ocean'];
    var t = localStorage.getItem('egs-theme') || 'dark';
    if (!allowedThemes.includes(t)) t = 'dark';
    document.documentElement.setAttribute('data-theme', t);

    var fontMap = {
      'segoe': "'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif",
      'inter': "'Inter', system-ui, -apple-system, sans-serif",
      'roboto': "'Roboto', system-ui, -apple-system, sans-serif",
      'jakarta': "'Plus Jakarta Sans', system-ui, -apple-system, sans-serif",
      'outfit': "'Outfit', system-ui, -apple-system, sans-serif",
      'jetbrains': "'JetBrains Mono', monospace"
    };
    var f = localStorage.getItem('egs-font') || 'segoe';
    if (fontMap[f]) document.documentElement.style.setProperty('--font-main', fontMap[f]);

    var avatarPalette = {
      'gold': { bg: 'linear-gradient(135deg, #D4AF37, #B6952C)', txt: '#111111', border: '#D4AF37' },
      'blue': { bg: 'linear-gradient(135deg, #3B8ED0, #2563EB)', txt: '#FFFFFF', border: '#3B8ED0' },
      'emerald': { bg: 'linear-gradient(135deg, #2ECC71, #27AE60)', txt: '#FFFFFF', border: '#2ECC71' },
      'purple': { bg: 'linear-gradient(135deg, #9B59B6, #8E44AD)', txt: '#FFFFFF', border: '#9B59B6' },
      'crimson': { bg: 'linear-gradient(135deg, #E74C3C, #C0392B)', txt: '#FFFFFF', border: '#E74C3C' },
      'cyan': { bg: 'linear-gradient(135deg, #00C0EF, #0097A7)', txt: '#FFFFFF', border: '#00C0EF' },
      'amber': { bg: 'linear-gradient(135deg, #F39C12, #E67E22)', txt: '#FFFFFF', border: '#F39C12' },
      'slate': { bg: 'linear-gradient(135deg, #64748B, #475569)', txt: '#FFFFFF', border: '#64748B' }
    };
    var a = localStorage.getItem('egs-avatar') || 'blue';
    if (avatarPalette[a]) {
      document.documentElement.style.setProperty('--avatar-bg', avatarPalette[a].bg);
      document.documentElement.style.setProperty('--avatar-txt', avatarPalette[a].txt);
      document.documentElement.style.setProperty('--avatar-border', avatarPalette[a].border);
    }
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // updateViaCache: 'none' — stops the BROWSER's own HTTP cache from ever
    // serving a stale copy of sw.js itself. Without this, the browser can
    // treat /sw.js like any other static resource and keep re-using an old
    // cached copy of the service worker file even after a fresh deploy,
    // which is why the PWA kept running old fetch-handling logic.
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((error) => {
      console.warn('Service worker registration failed:', error);
    });

    // Once a NEW service worker takes control (after an update), reload
    // the open PWA/tab automatically so it starts using the new logic
    // immediately instead of waiting for the user to fully close and
    // reopen the app.
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  });
}
</script>
