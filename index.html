<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eco Green Solar ERP — Web</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<!-- Barcode/QR camera scanning (Sheets feature) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" defer></script>
<!-- XLSX parsing for Sheets "Import CSV/XLSX" (CSV import needs no library) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fa-solid fa-bolt bolt"></i><span>ECO GREEN SOLAR</span></div>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="profile-box">
      <div class="avatar">S</div>
      <div>
        <div class="role">Super Admin</div>
        <div class="user">@sumit</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
   <div class="mobile-topbar">
  <div class="mobile-topbar-row">
    <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
    <div class="brand"><i class="fa-solid fa-bolt bolt"></i><span>ECO GREEN SOLAR</span></div>
    <div class="avatar" style="width:34px;height:34px;font-size:13px;">S</div>
  </div>
  <div class="search-mini mobile-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" name="egs-quick-search-mobile" id="egsQuickSearchMobile" placeholder="Quick search anything..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" readonly onfocus="this.removeAttribute('readonly');" onblur="if(!this.value) this.setAttribute('readonly','readonly');"></div>
</div>

    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Live overview of stock &amp; operations</div>
      </div>
      <div class="search-mini"><i class="fa-solid fa-magnifying-glass"></i><input type="search" name="egs-quick-search" id="egsQuickSearch" placeholder="Quick search anything..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" readonly onfocus="this.removeAttribute('readonly');" onblur="if(!this.value) this.setAttribute('readonly','readonly');"></div>
    </div>

    <div class="content" id="content"><!-- page HTML injected here by js/app.js --></div>

    <footer class="note">Eco Green Solar ERP &copy; <span id="footerYear"></span> Eco Green Solar &nbsp;•&nbsp; Developed by Sumit</footer>
  </div>
</div>

<!-- Generic modal (used for Live User Sessions popup etc.) -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Confirm dialog (replaces native window.confirm() popups everywhere —
     see window.confirmDialog() in js/app.js). Same custom-card look as the
     generic modal above, just with an icon + accent colour per "kind" and
     Cancel/Confirm buttons, mirroring the desktop app's ui/notify.py. -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card" id="confirmCard">
    <div class="confirm-row">
      <div class="confirm-icon" id="confirmIcon"><i class="fa-solid fa-question"></i></div>
      <div class="confirm-text">
        <h3 class="confirm-title" id="confirmTitle">Please Confirm</h3>
        <p class="confirm-msg" id="confirmMsg"></p>
      </div>
    </div>
    <div class="confirm-btns">
      <button type="button" id="confirmBtnCancel">Cancel</button>
      <button type="button" class="confirm-primary" id="confirmBtnOk">OK</button>
    </div>
  </div>
</div>

<!-- Shared in-memory data stores (loaded first so page scripts can use them) -->
<script src="js/data/purchase-data.js?v=2"></script>
<!-- NEW: talks to the backend API (server.js), which reads the same MariaDB
     database the desktop .py app uses. Must load before dashboard.js/masters.js. -->
<script src="js/data/api.js?v=2"></script>
<!-- Sheets (Scan To Sheet) feature: offline localStorage layer, loaded before its page module -->
<script src="js/data/sheets-store.js?v=1"></script>
<!-- Each page's markup + data lives in its own file, like dashboard.py / masters.py in the desktop app -->
<script src="js/pages/dashboard.js?v=2"></script>
<script src="js/pages/scansheet.js?v=3"></script>
<script src="js/pages/masters.js?v=2"></script>
<script src="js/pages/purchase.js?v=2"></script>
<script src="js/pages/sales.js?v=2"></script>
<script src="js/pages/stockassign.js?v=2"></script>
<script src="js/pages/purchaseregister.js?v=2"></script>
<script src="js/pages/saleregister.js?v=2"></script>
<script src="js/pages/reports.js?v=2"></script>
<script src="js/pages/returns.js?v=2"></script>
<script src="js/pages/partyledger.js?v=2"></script>
<script src="js/pages/lowstock.js?v=2"></script>
<script src="js/pages/backup.js?v=2"></script>
<script src="js/pages/bom.js?v=2"></script>
<!-- app.js runs last: builds nav from window.PAGES and wires everything up -->
<script src="js/app.js?v=2"></script>
</body>
</html>
